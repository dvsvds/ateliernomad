<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary SEO -->
    <title>Atelier Nomàd — Handcrafted Moroccan Living</title>
    <meta name="description" content="Atelier Nomàd biedt handgemaakte Marokkaanse interieurstukken: vintage vloerpoufs en handgeweven wollen kussens. Authentiek, ambachtelijk en tijdloos." />
    <meta name="theme-color" content="#FAF6EF" />
    <link rel="canonical" href="https://xn--ateliernomd-h7a.be/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atelier Nomàd" />
    <meta property="og:title" content="Atelier Nomàd — Handcrafted Moroccan Living" />
    <meta property="og:description" content="Authentieke Marokkaanse interieurstukken, handgemaakt met ziel en geselecteerd voor tijdloze interieurs." />
    <meta property="og:image" content="https://xn--ateliernomd-h7a.be/images/brand/og-image.jpg" />
    <meta property="og:url" content="https://xn--ateliernomd-h7a.be/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atelier Nomàd — Handcrafted Moroccan Living" />
    <meta name="twitter:description" content="Luxe, handgemaakte Marokkaanse interieurstukken voor tijdloze interieurs." />
    <meta name="twitter:image" content="https://xn--ateliernomd-h7a.be/images/brand/og-image.jpg" />

    <!-- Fonts: Cormorant Garamond (serif display) + Jost (sans body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Atelier Nomàd",
      "description": "Handgemaakte Marokkaanse interieurstukken: vintage vloerpoufs en handgeweven wollen kussens.",
      "url": "https://xn--ateliernomd-h7a.be/",
      "image": "https://xn--ateliernomd-h7a.be/images/brand/og-image.jpg",
      "sameAs": ["https://www.instagram.com/ateliernomad__/"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms: verborgen kopieën van de React-formulieren, zodat
         Netlify ze bij het deployen herkent. De veldnamen moeten gelijk
         blijven aan die in Contact.jsx en Newsletter.jsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <!-- Bestelmelding: wordt door netlify/functions/stripe-webhook.cjs ingevuld
         na elke geslaagde Stripe-betaling, niet door bezoekers. -->
    <form name="bestelling" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="status" />
      <input type="text" name="bestelnummer" />
      <input type="text" name="datum" />
      <input type="text" name="totaal" />
      <input type="text" name="verzending" />
      <input type="text" name="btw" />
      <textarea name="artikelen"></textarea>
      <input type="text" name="naam" />
      <input type="email" name="email" />
      <textarea name="leveradres"></textarea>
      <input type="text" name="stripe" />
      <input type="text" name="bot-field" />
    </form>
    <form name="nieuwsbrief" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
