<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicons: .ico voor oude browsers en Google, svg voor moderne
         browsers, png voor Google (veelvoud van 48 px) en iPhone/Android. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#FAF6EF" />

    <!-- SEO: per pagina ingevuld door scripts/prerender.mjs (bij de build)
         en door src/hooks/useSeo.js (tijdens het surfen). -->
    <!--seo-->
    <title>Atelier Nomàd — Handcrafted Moroccan Living</title>
    <meta name="description" content="Atelier Nomàd biedt handgemaakte Marokkaanse interieurstukken: vintage vloerpoufs en handgeweven wollen kussens. Authentiek, ambachtelijk en tijdloos." />
    <link rel="canonical" href="https://ateliernomad.eu/" />
    <!--/seo-->

    <!-- Fonts: Cormorant Garamond (serif display) + Jost (sans body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Structured data: de winkel zelf (op elke pagina) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "@id": "https://ateliernomad.eu/#winkel",
      "name": "Atelier Nomàd",
      "description": "Handgemaakte Marokkaanse interieurstukken: vintage vloerpoufs en handgeweven wollen kussens.",
      "url": "https://ateliernomad.eu/",
      "logo": "https://ateliernomad.eu/icon-512.png",
      "image": "https://ateliernomad.eu/images/brand/og-image.jpg",
      "email": "ateliernomad01@gmail.com",
      "vatID": "BE1035137874",
      "areaServed": "EU",
      "sameAs": ["https://www.instagram.com/ateliernomad__/"]
    }
    </script>
    <script type="application/ld+json">
    { "@context": "https://schema.org", "@type": "WebSite", "name": "Atelier Nomàd", "url": "https://ateliernomad.eu/", "inLanguage": "nl-BE" }
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>

    <!-- Netlify Forms: verborgen kopieën van de React-formulieren, zodat
         Netlify ze bij het deployen herkent. De veldnamen moeten gelijk
         blijven aan die in Contact.jsx en Newsletter.jsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <!-- Bestelmelding: wordt door netlify/functions/stripe-webhook.cjs ingevuld
         na elke geslaagde Stripe-betaling, niet door bezoekers. -->
    <form name="bestelling" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="status" />
      <input type="text" name="bestelcode" />
      <input type="text" name="bestelnummer" />
      <input type="text" name="datum" />
      <input type="text" name="totaal" />
      <input type="text" name="verzending" />
      <input type="text" name="btw" />
      <textarea name="artikelen"></textarea>
      <input type="text" name="naam" />
      <input type="email" name="email" />
      <textarea name="leveradres"></textarea>
      <input type="text" name="klantmail" />
      <input type="text" name="stripe" />
      <input type="text" name="bot-field" />
    </form>
    <form name="nieuwsbrief" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
